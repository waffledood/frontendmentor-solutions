<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <!-- Google Font: Space Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./style.css" />

    <!-- <script src="./index.js"></script> -->

    <title>Frontend Mentor | Tip calculator app</title>
  </head>
  <body>
    <div>
      <img src="./images/logo.svg" alt="" />
    </div>
    <main>
      <div class="bill-section">
        <!-- Bill -->
        <div class="section">
          <label for="bill-amount" class="section__heading text-preset-5"
            >Bill</label
          >
          <span id="bill-amount-error" class="section__error"
            >Hidden error message</span
          >
          <div class="field">
            <img
              class="field__icon"
              src="./images/icon-dollar.svg"
              alt="dollar icon"
            />
            <input
              id="bill-amount"
              aria-describedby="bill-amount-error"
              aria-invalid="false"
              class="field__input text-preset-3"
              type="number"
              min="0"
              placeholder="0"
            />
          </div>
        </div>

        <!-- Tip Section -->
        <div class="section">
          <label for="tip-amount" class="section__heading text-preset-5"
            >Select Tip %</label
          >
          <span id="tip-amount-error" class="section__error"
            >Hidden error message</span
          >
          <div class="pills">
            <input
              class="pill__input"
              type="radio"
              id="5"
              name="tip"
              value="5"
            />
            <label class="pill text-preset-3" for="5">5%</label>

            <input
              class="pill__input"
              type="radio"
              id="10"
              name="tip"
              value="10"
            />
            <label class="pill text-preset-3" for="10">10%</label>

            <input
              class="pill__input"
              type="radio"
              id="15"
              name="tip"
              value="15"
            />
            <label class="pill text-preset-3" for="15">15%</label>

            <input
              class="pill__input"
              type="radio"
              id="25"
              name="tip"
              value="25"
            />
            <label class="pill text-preset-3" for="25">25%</label>

            <input
              class="pill__input"
              type="radio"
              id="50"
              name="tip"
              value="50"
            />
            <label class="pill text-preset-3" for="50">50%</label>

            <input
              class="pill__input"
              type="radio"
              id="tip-amount"
              name="tip"
              value="0"
            />
            <label class="pill pill--custom text-preset-3" for="tip-amount"
              >Custom</label
            >
          </div>
        </div>

        <!-- People Section -->
        <div class="section">
          <label for="people-count" class="section__heading text-preset-5"
            >Number of People</label
          >
          <span id="people-count-error" class="section__error"
            >Hidden error message</span
          >
          <div class="field">
            <img
              class="field__icon"
              src="./images/icon-person.svg"
              alt="person icon"
            />
            <input
              id="people-count"
              aria-describedby="people-count-error"
              aria-invalid="false"
              class="field__input text-preset-3"
              type="number"
              min="0"
              step="1"
              placeholder="0"
            />
          </div>
        </div>
      </div>
      <div class="results-section"></div>
      <!-- tip values are built with radio inputs -->
    </main>
  </body>
</html>
