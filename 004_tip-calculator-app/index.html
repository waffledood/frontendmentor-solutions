<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <!-- Google Font: Space Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./style.css" />

    <!-- <script src="./index.js"></script> -->

    <title>Frontend Mentor | Tip calculator app</title>
  </head>
  <body>
    <div>
      <img src="./images/logo.svg" alt="" />
    </div>
    <main>
      <div class="bill-section">
        <div class="section">
          <label for="bill-amount" class="section__heading text-preset-5"
            >Bill</label
          >
          <span id="bill-amount-error" class="section__error"
            >Hidden error message</span
          >
          <div class="field">
            <img
              class="field__icon"
              src="./images/icon-dollar.svg"
              alt="dollar icon"
            />
            <input
              id="bill-amount"
              aria-describedby="bill-amount-error"
              aria-invalid="false"
              class="field__input text-preset-3"
              type="number"
              min="0"
            />
          </div>
        </div>
      </div>
      <div class="results-section"></div>
      <!-- tip values are built with radio inputs -->
    </main>
  </body>
</html>
